services:
  - type: web
    name: smart-pos
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: cd server && npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: 8h
